<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Main</title>
  </head>
  <style>
    * {
      transition: all 0.3s ease;
    }
    body,
    html {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 10%;
    }
    main {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 400px;
      align-items: center;
      border: 1px solid rgb(50, 50, 50);
      border-radius: 20px;
      justify-content: center;
      padding-bottom: 3%;
    }
    button {
      width: 50%;
      height: 25px;
      border-radius: 10px;
      border: none;
      color: white;
      background-color: blue;
    }
    main a {
      width: 200px;
      height: 20px;
      background-color: blue;
      color: white;
      text-align: center;
      border: none;
      border-radius: 10px;
    }
    a {
      background-color: blue;
      color: white;
    }
    a:hover {
      opacity: 0.5;
    }
  </style>
  <body>
    <main>
      <h2>Register or Login</h2>
      <a href="register.html">Register</a>
      <a href="login.html">Login</a>
    </main>
  </body>
</html>
